.art-view{overflow:clip}
.player-options{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;margin-top:8px}.player-options .speed-control{margin:0}.player-volume{display:flex;align-items:center;gap:10px;flex:1;min-width:210px;max-width:450px;color:var(--muted);font-size:12px}.player-volume input[type="range"]{flex:1;min-width:0;padding:0;accent-color:var(--accent);cursor:pointer}.volume-number{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}.volume-number input[type="number"]{width:76px;padding:3px 5px;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}.art-options .art-volume{flex:1;min-width:300px;max-width:520px;width:520px}.art-volume input[type="number"]{flex:none;width:76px;min-width:76px;padding:3px 5px;border:1px solid var(--line);background:#ffffffb8;cursor:text}.speed-control{cursor:ns-resize}.artwork-notice{display:block;color:#9a4c14;font-size:12px;margin:-5px 0 10px}@media(max-width:640px){.art-options .art-volume{min-width:0;flex-basis:100%;width:100%}.player-options{gap:8px}.player-volume{max-width:none;flex-basis:100%}body.has-player{padding-bottom:225px}}
.speed-control{display:flex;align-items:center;gap:9px;flex:1;min-width:250px;max-width:520px}.speed-control>label:first-child{white-space:nowrap}.speed-control input[type="range"]{flex:1;min-width:90px;width:150px;padding:0;accent-color:var(--accent);cursor:pointer}.speed-number{display:flex;align-items:center;gap:3px;white-space:nowrap}.speed-number input{width:66px;padding:3px 4px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}.player-options .player-volume,.player-options .speed-control{flex-basis:100%;max-width:none}.art-options{gap:10px}.art-options .art-volume,.art-options .speed-control{flex-basis:100%;width:100%;max-width:620px}.art-header-actions{display:flex;align-items:center;gap:12px}.art-header-actions>button{font-size:12px;background:#ffffffb8;white-space:nowrap}.actions .edit-cover-button{display:flex;align-items:center;justify-content:center;padding:8px 10px;min-width:106px}.cover-editor{width:min(520px,calc(100vw - 28px));max-height:calc(100dvh - 40px);padding:26px;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 80px #18233540;color:var(--text);background:var(--surface);overflow:auto}.cover-editor::backdrop{background:#18233588;backdrop-filter:blur(5px)}.cover-editor h2{margin:0;font-size:23px}.cover-editor-track{margin:8px 0;font-weight:600;overflow-wrap:anywhere}.cover-editor-hint{display:block;font-size:12px;color:var(--muted);line-height:1.8}.cover-preview{width:min(210px,100%);aspect-ratio:1;margin:16px auto;display:grid;place-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:12px;overflow:hidden}.cover-preview img{width:100%;height:100%;object-fit:contain}.cover-preview span{font-size:12px;color:var(--muted)}#chooseCover{display:block;margin:0 auto 10px}.cover-save-status{font-size:12px;min-height:20px;margin:12px 0;color:var(--muted)}.cover-save-status.error{color:#b03532}.cover-editor-actions{display:flex;justify-content:flex-end;gap:10px}.cover-editor[aria-busy="true"] .cover <body>
<main class="library">
  <header class="heading"><div><p class="eyebrow">YOUR MUSIC LIBRARY</p><h1>音楽一覧</h1></div><p id="stats" aria-live="polite"></p></header>
  <div class="toolbar">
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q" type="search" placeholder="曲名・アルバム名・アーティスト名を検索" aria-label="検索"></div>
    <select id="field" aria-label="並べ替え項目"><option value="title">曲名</option><option value="album">アルバム名</option><option value="artist">アーティスト名</option><option value="seconds">長さ</option></select>
    <select id="dir" aria-label="並べ替え順"><option value="1">昇順</option><option value="-1">降順</option></select>
    <label class="size-label">1ページ <input id="size" type="number" min="1" max="10000" value="100" aria-label="1ページの表示件数"> 曲</label>
  </div>
  <p class="hint">列名をクリックしても並べ替えできます。タグのない曲名はファイル名を表示します。「—」は未取得です。再生・ファイルの場所の表示には「MusicLibrary.exe」から一覧を開いてください。</p>
  <div class="table-wrap"><table><thead><tr><th>ジャケット</th><th><button data-key="title">曲名</button></th><th><button data-key="album">アルバム名</button></th><th><button data-key="artist">アーティスト名</button></th><th><button data-key="seconds">長さ</button></th><th>音源</th></tr></thead><tbody id="rows"></tbody></table></div>
  <nav class="pages" aria-label="ページ切り替え"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></nav>
</main>
<section id="player" class="player" aria-label="音楽プレイヤー" hidden>
  <button id="openArtwork" class="player-art-button" aria-label="再生中のジャケットを大きく表示" title="ジャケットを大きく表示"><span id="playerArt" class="player-art"><img id="playingCover" alt="" hidden><span id="playingCoverFallback" class="player-art-fallback" aria-label="ジャケット未設定">♪</span></span></button>
  <div class="track-info"><p class="now-label">NOW PLAYING</p><strong id="playing"></strong><span id="playingMeta"></span><small id="audioStatus" role="status"></small></div>
  <div class="player-controls"><audio id="audio" controls preload="metadata" aria-label="再生・一時停止・音量・再生位置"></audio><div class="player-options"><div class="player-volume"><span>音量</span><input id="playerVolume" type="range" min="0" max="100" step="0.1" value="100" aria-label="一覧の音量"><label class="volume-number"><input id="playerVolumeNumber" type="number" min="0" max="100" step="0.1" value="100.0" aria-label="一覧の音量の数値">%</label></div><div class="speed-control" title="ホイールで0.05倍ずつ変更（上で速く・下で遅く）"><label for="playbackSpeed">再生速度</label><input id="playbackSpeed" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="一覧の再生速度"><label class="speed-number"><input id="playbackSpeedNumber" type="number" min="0.5" max="2" step="0.05" value="1.00" aria-label="一覧の再生速度の数値">×</label></div></div></div>
</section>
<dialog id="artView" class="art-view" aria-labelledby="artTitle">
  <img id="artBackdrop" class="art-backdrop" alt="" aria-hidden="true" hidden>
  <header class="art-header"><button id="closeArtwork" class="art-back">← 音楽一覧に戻る</button><div class="art-header-actions"><button id="editCurrentCover" type="button">ジャケットを設定</button><div class="art-shape-controls" role="group" aria-label="ジャケットの表示方法"><button type="button" data-art-shape="cd" aria-pressed="true">CD</button><button type="button" data-art-shape="square" aria-pressed="false">ジャケット</button></div></div></header>
  <div class="art-body"><div id="largeArt" class="large-art"><img id="largeCover" alt="" hidden><span id="largeCoverFallback" class="large-art-fallback" aria-label="ジャケット未設定">♪</span></div></div>
  <footer class="art-footer"><h2 id="artTitle" class="art-title"></h2><p id="artMeta" class="art-meta"></p><small id="artworkNotice" class="artwork-notice" role="status" hidden></small><div class="art-transport"><button id="artTogglePlay" class="art-toggle" aria-label="再生を再開">再生する</button><input id="artSeek" class="art-seek" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="大きいジャケット画面の再生位置"><span id="artTime" class="art-time">0:00 / 0:00</span></div><div class="art-options"><div class="art-volume"><button id="artMute" class="art-mute" aria-label="ミュートする" aria-pressed="false">音量</button><input id="artVolume" type="range" min="0" max="100" step="0.1" value="100" aria-label="音量"><label class="volume-number"><input id="artVolumeNumber" type="number" min="0" max="100" step="0.1" value="100.0" aria-label="音量の数値">%</label></div><div class="speed-control" title="ホイールで0.05倍ずつ変更（上で速く・下で遅く）"><label for="artSpeed">再生速度</label><input id="artSpeed" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="ジャケット画面の再生速度"><label class="speed-number"><input id="artSpeedNumber" type="number" min="0.5" max="2" step="0.05" value="1.00" aria-label="ジャケット画面の再生速度の数値">×</label></div></div><small id="artStatus" class="art-status" role="status"></small></footer>
</dialog>
<dialog id="coverEditor" class="cover-editor" aria-labelledby="coverEditorTitle">
  <h2 id="coverEditorTitle">ジャケットを設定</h2><p id="coverEditorTrack" class="cover-editor-track"></p>
  <p class="cover-editor-hint">この曲の音源ファイルに画像を埋め込みます。保存前の音源は自動でバックアップします。</p>
  <div class="cover-preview"><img id="coverPreview" alt="選択したジャケット" hidden><span id="coverPreviewEmpty">画像を選んでください</span></div>
  <input id="coverFile" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
  <button id="chooseCover" type="button">画像を選択（JPEG / PNG）</button>
  <small class="cover-editor-hint">10MB以下。大きい画像は長辺1600pxまでに調整します。設定はこの1曲に適用されます。</small>
  <p id="coverSaveStatus" class="cover-save-status" role="status"></p>
  <div class="cover-editor-actions"><button id="cancelCover" type="button">閉じる</button><button id="saveCover" class="art-toggle" type="button" disabled>音源に保存</button></div>
</dialog>
<script id="data" type="application/json">__DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent);
const collator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});
const token="__TOKEN__",$=id=>document.getElementById(id);
let page=0,size=100,currentId=null,currentTrack=null,playRequest=0,artReturnFocus=null,artworkVersion=null,artCloseTimer=null;
const labels={title:'曲名',album:'アルバム名',artist:'アーティスト名',seconds:'長さ'};
function filtered(){
  const q=$('q').value.trim().toLocaleLowerCase(),key=$('field').value,dir=Number($('dir').value);
  const list=data.filter(r=>[r.title,r.album,r.artist].some(x=>(x||'').toLocaleLowerCase().includes(q)));
  list.sort((a,b)=>{const x=a[key],y=b[key],xm=x===null||x==='',ym=y===null||y==='';if(xm||ym)return xm===ym?collator.compare(a.path,b.path):xm?1:-1;const c=key==='seconds'?x-y:collator.compare(x,y);return c*dir||collator.compare(a.path,b.path)});
  return list;
}
function coverPlaceholder(){const el=document.createElement('span');el.className='nocover';el.textContent='♪';el.title='ジャケット未設定';return el}
function markCurrent(){document.querySelectorAll('#rows tr[data-track-id]').forEach(tr=>tr.classList.toggle('is-current',Number(tr.dataset.trackId)===currentId))}
function render(){
  size=Math.max(1,Math.min(10000,Math.floor(Number($('size').value)||100)));$('size').value=String(size);
  const list=filtered(),pages=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,pages-1);
  const fragment=document.createDocumentFragment();
  for(const r of list.slice(page*size,(page+1)*size)){
    const tr=document.createElement('tr'),covercell=document.createElement('td');tr.dataset.trackId=String(r.id);
    const coverButton=document.createElement('button');coverButton.className='cover-button';coverButton.setAttribute('aria-label',`${r.title}のジャケットを大きく表示`);coverButton.title='ジャケットを大きく表示';coverButton.onclick=()=>openArtwork(r);
    if(r.cover){const img=document.createElement('img');img.className='cover';img.src=r.cover;img.alt=r.album?`${r.album}のジャケット`:'ジャケット';img.loading='lazy';img.onerror=()=>img.replaceWith(coverPlaceholder());coverButton.append(img)}else coverButton.append(coverPlaceholder());covercell.append(coverButton);
    tr.append(covercell);
    for(const v of [r.title,r.album,r.artist,r.length]){const td=document.createElement('td');td.textContent=v||'—';tr.append(td)}
    tr.children[1].title=r.title_from_filename?'曲名タグがないためファイル名を表示':'';
    const td=document.createElement('td'),actions=document.createElement('div'),play=document.createElement('button');actions.className='actions';
    play.className='play-button';play.textContent='再生する';play.title='この画面で音源を再生';play.setAttribute('aria-label',`${r.title}を再生する`);play.onclick=()=>playTrack(r);actions.append(play);
    const reveal=document.createElement('button');reveal.className='reveal-button';reveal.textContent='場所を開く';reveal.title='エクスプローラーでこのファイルを選択';
    reveal.onclick=async()=>{reveal.disabled=true;try{const response=await fetch(location.protocol==='http:'?'/reveal':'http://127.0.0.1:8765/reveal',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:r.id,path:r.path,token})});if(!response.ok)throw Error()}catch(e){alert('「MusicLibrary.exe」を起動して、その画面で操作してください。')}finally{reveal.disabled=false}};
    actions.append(reveal);const edit=document.createElement('button');edit.className='edit-cover-button';edit.title='ジャケットを設定';edit.setAttribute('aria-label',`${r.title}のジャケットを設定`);edit.textContent='ジャケットを設定';edit.onclick=()=>openCoverEditor(r);actions.append(edit);td.append(actions);tr.append(td);fragment.append(tr);
  }
  if(!list.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='検索に一致する楽曲がありません。';tr.append(td);fragment.append(tr)}
  $('rows').replaceChildren(fragment);markCurrent();
  $('stats').textContent=`全 ${data.length.toLocaleString()} 曲 ／ 検索結果 ${list.length.toLocaleString()} 曲`;
  $('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
  document.querySelectorAll('[data-key]').forEach(b=>{const active=$('field').value===b.dataset.key;b.textContent=labels[b.dataset.key]+(active?(Number($('dir').value)===1?' ▲':' ▼'):'');b.closest('th').setAttribute('aria-sort',active?(Number($('dir').value)===1?'ascending':'descending'):'none')});
}
function status(message,error=false){for(const id of ['audioStatus','artStatus']){$(id).textContent=message;$(id).classList.toggle('error',error)}}
function stopRotation(){for(const id of ['player','artView'])$(id).classList.remove('is-playing');updateArtworkControls()}
function artworkNotice(message=''){$('artworkNotice').textContent=message;$('artworkNotice').hidden=!message}
function setArtwork(r){
  artworkNotice();
  $('artTitle').textContent=r.title;$('artTitle').title=r.title;$('artMeta').textContent=[r.artist||'アーティスト未設定',r.album].filter(Boolean).join(' ／ ');
  $('artBackdrop').hidden=true;$('artBackdrop').removeAttribute('src');
  for(const [imageId,artId,fallbackId] of [['playingCover','playerArt','playingCoverFallback'],['largeCover','largeArt','largeCoverFallback']]){
    const img=$(imageId),art=$(artId),fallback=$(fallbackId);
    art.classList.remove('has-cover');img.hidden=true;fallback.hidden=false;img.dataset.fullArtwork='false';img.removeAttribute('src');
    img.onload=()=>{if(currentId!==r.id)return;img.hidden=false;fallback.hidden=true;art.classList.add('has-cover');if(imageId==='largeCover'){if(img.dataset.fullArtwork==='true')artworkNotice();$('artBackdrop').src=r.cover;$('artBackdrop').hidden=false}};
    img.onerror=()=>{if(imageId==='largeCover'&&img.dataset.fullArtwork==='true'){artworkNotice('元のジャケット画像を取得できないため、低解像度で表示しています。「MusicLibrary.exe」から開き直してください。');img.dataset.fullArtwork='false';img.src=r.cover;return}img.hidden=true;fallback.hidden=false;art.classList.remove('has-cover');if(imageId==='largeCover')$('artBackdrop').hidden=true};
    if(r.cover){img.alt=(r.album||r.title)+'のジャケット';img.src=r.cover}
  }
}
function loadFullArtwork(r){if(!r.cover)return;if(location.protocol!=='http:'||(artworkVersion!==null&&artworkVersion<4)){artworkNotice('古い補助プログラムではジャケットが低解像度になります。「MusicLibrary.exe」から開き直してください。');return}if(artworkVersion===null)return;const img=$('largeCover');img.dataset.fullArtwork='true';img.src='/artwork/'+r.id+'?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(r.path)}
function formatTime(value){const t=Math.max(0,Math.floor(Number.isFinite(value)?value:0));return t>=3600?`${Math.floor(t/3600)}:${String(Math.floor(t/60)%60).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`:`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}
function updateArtworkControls(){
  const audio=$('audio'),duration=Number.isFinite(audio.duration)?audio.duration:0,isPaused=audio.paused||audio.ended;
  $('artTogglePlay').textContent=isPaused?'再生する':'一時停止';$('artTogglePlay').setAttribute('aria-label',isPaused?'再生を再開':'再生を一時停止');
  $('artSeek').max=String(duration);$('artSeek').disabled=duration<=0;$('artSeek').value=String(Math.min(audio.currentTime||0,duration));$('artSeek').setAttribute('aria-valuetext',`${formatTime(audio.currentTime)} / ${formatTime(duration)}`);$('artTime').textContent=`${formatTime(audio.currentTime)} / ${formatTime(duration)}`;
  const volume=(audio.muted?0:Math.round(audio.volume*1000)/10).toFixed(1);for(const id of ['artVolume','playerVolume']){$(id).value=volume;$(id).setAttribute('aria-valuetext',volume+'%')}for(const id of ['artVolumeNumber','playerVolumeNumber']){if(document.activeElement!==$(id))$(id).value=volume}$('artMute').setAttribute('aria-pressed',String(audio.muted));$('artMute').setAttribute('aria-label',audio.muted?'ミュートを解除':'ミュートする');$('artMute').textContent=audio.muted?'消音中':'音量';
}
function setArtworkShape(shape){const selected=shape==='square'?'square':'cd';document.body.dataset.artShape=selected;document.querySelectorAll('[data-art-shape]').forEach(button=>{if(button.tagName==='BUTTON')button.setAttribute('aria-pressed',String(button.dataset.artShape===selected))});try{localStorage.setItem('music-library-artwork-shape',selected)}catch(e){}}
function openArtwork(r){
  clearTimeout(artCloseTimer);$('artView').classList.remove('is-closing');
  artReturnFocus=document.activeElement;
  if(r&&(!currentTrack||r.id!==currentId))playTrack(r);
  if(!currentTrack)return;
  updateArtworkControls();if(!$('artView').open)$('artView').showModal();$('artView').scrollTop=0;document.body.classList.add('art-view-open');loadFullArtwork(currentTrack);$('closeArtwork').focus({preventScroll:true});
}
$('openArtwork').onclick=()=>openArtwork(currentTrack);
function finishArtworkClose(){clearTimeout(artCloseTimer);$('artView').classList.remove('is-closing');if($('artView').open)$('artView').close()}
function closeArtwork(){if(!$('artView').open||$('artView').classList.contains('is-closing'))return;if(matchMedia('(prefers-reduced-motion:reduce)').matches){finishArtworkClose();return}$('artView').classList.add('is-closing');artCloseTimer=setTimeout(finishArtworkClose,350)}
$('closeArtwork').onclick=closeArtwork;
$('artView').addEventListener('cancel',event=>{event.preventDefault();closeArtwork()});
$('artView').addEventListener('animationend',event=>{if(event.target===$('artView')&&event.animationName==='art-view-leave')finishArtworkClose()});
$('artView').addEventListener('close',()=>{clearTimeout(artCloseTimer);$('artView').classList.remove('is-closing');document.body.classList.remove('art-view-open');if(artReturnFocus?.isConnected)artReturnFocus.focus({preventScroll:true})});
document.querySelectorAll('button[data-art-shape]').forEach(button=>button.onclick=()=>setArtworkShape(button.dataset.artShape));
let savedShape='cd';try{savedShape=localStorage.getItem('music-library-artwork-shape')||'cd'}catch(e){}setArtworkShape(savedShape);
$('artTogglePlay').onclick=async()=>{const audio=$('audio');if(audio.paused||audio.ended){try{await audio.play()}catch(e){if(e.name!=='AbortError')status('音源を再生できません。「MusicLibrary.exe」から開き直してください。',true)}}else audio.pause()};
$('artSeek').addEventListener('input',()=>{if(Number.isFinite($('audio').duration)){$('audio').currentTime=Number($('artSeek').value);updateArtworkControls()}});
function setVolume(value){const volume=Number(value);if(!Number.isFinite(volume))return;const audio=$('audio');audio.volume=Math.round(Math.max(0,Math.min(100,volume))*10)/1000;audio.muted=false;updateArtworkControls()}
for(const id of ['artVolume','playerVolume'])$(id).addEventListener('input',event=>setVolume(event.target.value));
for(const id of ['artVolumeNumber','playerVolumeNumber']){$(id).addEventListener('input',event=>{if(event.target.value!==''&&event.target.validity.valid)setVolume(event.target.value)});$(id).addEventListener('change',event=>{if(event.target.value!==''&&event.target.validity.valid)setVolume(event.target.value);event.target.value=($('audio').muted?0:$('audio').volume*100).toFixed(1)})}
$('artMute').onclick=()=>{const audio=$('audio');audio.muted=!audio.muted;updateArtworkControls()};
for(const event of ['loadedmetadata','durationchange','timeupdate','seeked','play','volumechange'])$('audio').addEventListener(event,updateArtworkControls);
function syncPlaybackSpeed(){const rate=$('audio').playbackRate;for(const id of ['playbackSpeed','artSpeed']){const slider=$(id);slider.min=String(Math.min(.5,rate));slider.max=String(Math.max(2,rate));slider.value=String(rate);slider.setAttribute('aria-valuetext',rate.toFixed(2)+'倍')}for(const id of ['playbackSpeedNumber','artSpeedNumber']){const number=$(id);number.min=String(Math.min(.5,rate));number.max=String(Math.max(2,rate));if(document.activeElement!==number)number.value=rate.toFixed(2)}try{localStorage.setItem('music-library-playback-rate',String(rate))}catch(e){}}
function setPlaybackSpeed(value){const rate=Number(value);if(!Number.isFinite(rate)||rate<.25||rate>4)return;$('audio').defaultPlaybackRate=rate;$('audio').playbackRate=rate;$('audio').preservesPitch=true;syncPlaybackSpeed()}
for(const id of ['playbackSpeed','artSpeed']){
  const select=$(id);select.addEventListener('input',event=>setPlaybackSpeed(event.target.value));
  let wheelDelta=0;
  select.closest('.speed-control').addEventListener('wheel',event=>{
    if(event.ctrlKey||event.metaKey||!event.deltaY)return;
    event.preventDefault();
    const delta=event.deltaY*(event.deltaMode===1?40:event.deltaMode===2?400:1);
    if(Math.sign(delta)!==Math.sign(wheelDelta))wheelDelta=0;
    wheelDelta+=delta;if(Math.abs(wheelDelta)<40)return;
    setPlaybackSpeed(Math.max(.5,Math.min(2,Math.round(($('audio').playbackRate+(wheelDelta<0?.05:-.05))*100)/100)));wheelDelta=0;
  },{passive:false});
}
for(const id of ['playbackSpeedNumber','artSpeedNumber']){$(id).addEventListener('input',event=>{if(event.target.value!==''&&event.target.validity.valid)setPlaybackSpeed(event.target.value)});$(id).addEventListener('change',event=>{if(event.target.value!==''&&event.target.validity.valid)setPlaybackSpeed(event.target.value);event.target.value=$('audio').playbackRate.toFixed(2)})}
$('audio').addEventListener('ratechange',syncPlaybackSpeed);
let savedSpeed=1;try{savedSpeed=Number(localStorage.getItem('music-library-playback-rate'))||1}catch(e){}setPlaybackSpeed(savedSpeed);
async function playTrack(r){
  const request=++playRequest,audio=$('audio');
  audio.pause();audio.removeAttribute('src');audio.load();stopRotation();
  currentId=r.id;currentTrack=r;markCurrent();$('player').hidden=false;document.body.classList.add('has-player');
  $('playing').textContent=r.title;$('playing').title=r.title;$('playingMeta').textContent=[r.artist||'アーティスト未設定',r.album].filter(Boolean).join(' ／ ');setArtwork(r);status('読み込み中…');
  if(location.protocol==='http:'){
    try{const response=await fetch('/instance',{cache:'no-store'});if(!response.ok)throw Error();const instance=await response.json();if(request!==playRequest)return;artworkVersion=instance.version;if($('artView').open)loadFullArtwork(r);if(instance.version<3){status('古い補助プログラムが起動しています。「MusicLibrary.exe」を再実行してください。',true);return}}
    catch(e){if(request===playRequest)status('補助プログラムを確認できません。「MusicLibrary.exe」を再実行してください。',true);return}
  }
  if(request!==playRequest)return;
  audio.src=location.protocol==='http:'?'/audio/'+r.id+'?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(r.path):r.uri;audio.load();
  try{await audio.play()}catch(e){if(request===playRequest&&e.name!=='AbortError')status('再生ボタンを押してください。再生できない場合は「MusicLibrary.exe」から開き直してください。',true)}
}
$('audio').addEventListener('playing',()=>{for(const id of ['player','artView'])$(id).classList.add('is-playing');updateArtworkControls();status('再生中')});
$('audio').addEventListener('pause',()=>{stopRotation();if($('audio').currentSrc&&!$('audio').ended)status('一時停止')});
$('audio').addEventListener('ended',()=>{stopRotation();status('再生終了')});
$('audio').addEventListener('waiting',()=>{stopRotation();status('読み込み中…')});
$('audio').addEventListener('emptied',stopRotation);
$('audio').addEventListener('error',()=>{stopRotation();status('音源を再生できません。「MusicLibrary.exe」から開いているか、ファイルが存在するかを確認してください。',true)});
for(const id of ['q','field','dir','size'])$(id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()});
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if($('field').value===b.dataset.key)$('dir').value=String(-Number($('dir').value));else{$('field').value=b.dataset.key;$('dir').value='1'}page=0;render()});

let coverTarget=null,coverFile=null,coverObjectUrl=null,coverSaving=false,coverEditorFocus=null;
function coverMessage(message,error=false){$('coverSaveStatus').textContent=message;$('coverSaveStatus').classList.toggle('error',error)}
function releaseCoverPreview(){if(coverObjectUrl){URL.revokeObjectURL(coverObjectUrl);coverObjectUrl=null}}
async function openCoverEditor(r){
  coverTarget=r;coverFile=null;releaseCoverPreview();coverEditorFocus=document.activeElement;
  $('coverEditorTrack').textContent=[r.title,r.artist].filter(Boolean).join(' ／ ');$('coverFile').value='';$('saveCover').disabled=true;$('chooseCover').disabled=true;coverMessage('補助プログラムを確認しています…');
  $('coverPreview').hidden=!r.cover;$('coverPreviewEmpty').hidden=!!r.cover;if(r.cover)$('coverPreview').src=r.cover;else $('coverPreview').removeAttribute('src');
  $('coverEditor').showModal();
  try{const response=await fetch('/instance',{cache:'no-store'});if(!response.ok)throw Error();const instance=await response.json();if(instance.version<5)throw Error();if(r.cover)$('coverPreview').src='/artwork/'+r.id+'?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(r.path);$('chooseCover').disabled=false;coverMessage('保存しても音声の再圧縮は行いません。')}
  catch(e){coverMessage('ジャケットの設定には新版の補助プログラムが必要です。「MusicLibrary.exe」から開き直してください。',true)}
}
$('editCurrentCover').onclick=()=>{if(currentTrack)openCoverEditor(currentTrack)};
$('chooseCover').onclick=()=>$('coverFile').click();
$('coverFile').onchange=()=>{
  const file=$('coverFile').files[0];coverFile=null;$('saveCover').disabled=true;releaseCoverPreview();if(!file)return;
  if(file.size>10*1024*1024||!['image/jpeg','image/png'].includes(file.type)){coverMessage('10MB以下のJPEGまたはPNG画像を選んでください。',true);return}
  coverFile=file;coverObjectUrl=URL.createObjectURL(file);$('coverPreview').src=coverObjectUrl;$('coverPreview').hidden=false;$('coverPreviewEmpty').hidden=true;$('saveCover').disabled=false;coverMessage(file.name+' を音源に埋め込みます。');
};
$('coverPreview').onerror=()=>{if(coverFile){coverFile=null;$('saveCover').disabled=true;coverMessage('画像を表示できません。別のJPEGまたはPNGを選んでください。',true)}};
function closeCoverEditor(){if(!coverSaving)$('coverEditor').close()}
$('cancelCover').onclick=closeCoverEditor;
$('coverEditor').addEventListener('cancel',event=>{if(coverSaving)event.preventDefault()});
$('coverEditor').addEventListener('close',()=>{releaseCoverPreview();if(coverEditorFocus?.isConnected)coverEditorFocus.focus({preventScroll:true})});
function encodeCoverFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}
$('saveCover').onclick=async()=>{
  if(!coverTarget||!coverFile||coverSaving)return;
  const track=coverTarget,audio=$('audio'),active=currentId===track.id&&!!audio.currentSrc,resume=active&&!audio.paused,time=active?audio.currentTime:0;
  coverSaving=true;$('coverEditor').setAttribute('aria-busy','true');for(const id of ['saveCover','cancelCover','chooseCover'])$(id).disabled=true;coverMessage('画像を確認し、バックアップと音声データの検証を行っています…');
  if(active){audio.pause();audio.removeAttribute('src');audio.load()}
  let revision=Date.now();
  try{
    const image=await encodeCoverFile(coverFile),response=await fetch('/artwork',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token,id:track.id,path:track.path,image})});
    const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'保存できませんでした。');
    revision=result.revision;track.cover=result.cover;render();if(currentId===track.id){setArtwork(track);if($('artView').open)loadFullArtwork(track)}
    coverFile=null;coverMessage(result.refresh_warning||'保存しました。一覧と音源ファイルの両方に反映されました。保存前の音源は artwork-backups に保管しています。');
  }catch(error){coverMessage(error.message||'保存できませんでした。',true)}
  finally{
    if(active&&currentId===track.id){audio.addEventListener('loadedmetadata',()=>{audio.currentTime=Math.min(time,Number.isFinite(audio.duration)?audio.duration:time);if(resume)audio.play().catch(()=>status('再生ボタンを押してください。'))},{once:true});audio.src='/audio/'+track.id+'?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(track.path)+'&v='+revision;audio.load()}
    coverSaving=false;$('coverEditor').removeAttribute('aria-busy');$('cancelCover').disabled=false;$('chooseCover').disabled=false;$('saveCover').disabled=!coverFile;
  }
};

$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();
</script>
</body>
</html>
